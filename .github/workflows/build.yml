name: Build Feage
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 配置Gradle 8.4（官方action，自动处理，不用手动下gradlew）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # 下载MediaPipe人脸模型
      - name: Download MediaPipe model
        run: |
          mkdir -p app/src/main/assets
          wget https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task -O app/src/main/assets/face_landmarker.task

      # 编译APK
      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feage-APK
          path: app/build/outputs/apk/debug/app-debug.apk
