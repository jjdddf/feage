name: Build Feage
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 下载MediaPipe人脸模型
      - name: Download MediaPipe face landmarker model
        run: |
          mkdir -p app/src/main/assets
          wget https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task -O app/src/main/assets/face_landmarker.task
      
      # ==========新增：自动生成gradlew包装文件==========
      - name: Generate gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      # 编译APK
      - name: Build debug APK
        run: |
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feage-APK
          path: app/build/outputs/apk/debug/app-debug.apk
